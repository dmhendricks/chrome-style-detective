name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you can share, the easier it is to reproduce and fix.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: A clear, concise summary of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger this reliably?
      placeholder: |
        1. Enable Style Detective on …
        2. Hover over …
        3. Press …
      value: |
        1.
        2.
        3.
    validations:
      required: true

#   - type: textarea
#     id: expected
#     attributes:
#       label: Expected behavior
#       description: What did you expect to happen?
#     validations:
#       required: true

#   - type: textarea
#     id: actual
#     attributes:
#       label: Actual behavior
#       description: What happened instead?
#     validations:
#       required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: From `chrome://extensions` (e.g. 1.0.0), or the commit/tag if you're running from source.
      placeholder: 1.0.0
    validations:
      required: false

#   - type: dropdown
#     id: install-source
#     attributes:
#       label: How did you install Style Detective?
#       options:
#         - Chrome Web Store
#         - Load unpacked (from source / `dist/`)
#         - Other
#     validations:
#       required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Name and version (e.g. Chrome 138, Edge 138, Brave 1.80).
      placeholder: Chrome 138
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. macOS 26.5, Windows 11, Ubuntu 26.04
      placeholder: macOS 15.5
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Panel theme
      description: The Style Detective panel theme (from settings), if relevant.
      options:
        - Not sure / Not relevant
        - Light
        - Dark
    validations:
      required: false

  - type: input
    id: page-url
    attributes:
      label: Page URL (optional, but recommended)
      description: A public URL where this can be reproduced. Skip or redact if the page is private.
      placeholder: https://example.com/...
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recordings
      description: Drag and drop images or videos here if they help illustrate the issue. Free "F" in Style Detective to freeze the panel for easier screenshots.
    validations:
      required: false

